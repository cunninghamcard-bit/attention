name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Architecture tests follow renderer history across the monorepo
          # split, so the relocation commit must remain reachable.
          fetch-depth: 0
      # Use the pinned Node/pnpm toolchain and the same gate as local handoffs.
      - uses: jdx/mise-action@v2
      - run: mise run setup
        env:
          CI: "true"
      # The runner exports a real GITHUB_TOKEN; the service's env fallback
      # would pick it up and the refuses-without-a-token test could never
      # refuse. Tests run token-hermetic.
      - run: mise run gate
        env:
          GITHUB_TOKEN: ""
      - run: mise run packcheck
      # Not here yet (documented follow-up): the electron e2e / perf
      # harness (needs xvfb + a display) — stays local-only for now.
