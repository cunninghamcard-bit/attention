version: "2"

# Ratchet, not a big bang. This gate exists for one failure mode: a change
# lands, the old path stays behind, and the leftover looks like a real
# fallback so nobody deletes it. `unused` catches the orphaned code;
# `unparam` catches the zombie signature — a return value that outlived its
# error path and forces every caller to keep a dead branch.
#
# errcheck / staticcheck / gosec are the next notch (34 open findings as of
# the first run); add them once these are green and stay green.
linters:
  default: none
  enable:
    - unused
    - unparam

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers legitimately take arguments only one caller varies.
      - path: _test\.go
        linters:
          - unparam
      # `Close() error` is the io.Closer contract. Keep the signature even when
      # this implementation cannot fail — callers defer it and discard with
      # `_ =`, and a bare `Close()` would break both idiom and those sites.
      - text: '^\(\*\w+\)\.Close - result 0 \(error\) is always nil'
        linters:
          - unparam

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
