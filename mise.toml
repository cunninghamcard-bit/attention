# Toolchain control: mise pins tool versions and is the task entry point; vp
# (Vite+) fronts dev, test, build, and formatting, while repository-owned
# oxfmt/oxlint versions are the lint authority so warnings can fail the gate.
# pnpm still owns dependencies underneath; tsc lanes stay explicit because vp
# check's type stage does not engage this repo.
# Task taxonomy mirrors memoh.
# New machine: `mise run setup`, then `mise run lint && mise run typecheck &&
# mise run test`.

[tools]
node = "26.3.0"
pnpm = "11.7.0"

[tasks.pnpm-install]
description = "Install dependencies — pnpm (a preinstall hook enforces pnpm-only)"
run = "pnpm install --frozen-lockfile"

[tasks.setup]
description = "Setup development environment"
depends = ["pnpm-install"]

[tasks.dev]
description = "Vite dev server at http://127.0.0.1:5173"
run = "pnpm exec vp run dev"

[tasks.lint]
description = "Run all linters (non-mutating; format is checked, not rewritten)"
run = ["pnpm run format:check", "pnpm run lint"]

[tasks."lint:es"]
description = "Run the JS/TS linter"
run = "pnpm run lint"

[tasks.format]
description = "Rewrite formatting, via vp (vendored trees excluded by .prettierignore). NEVER `vp check --fix`: its lint autofixes rewrite semantics."
run = "pnpm exec vp fmt"

[tasks.typecheck]
description = "All three tsc lanes, cached (pure function of sources + tsconfig). Stays explicit: red-probed vp check and it passes a bare type error — its type stage does not engage this repo."
run = [
  "pnpm exec vp run --cache typecheck",
  "pnpm exec vp run --cache typecheck:electron",
  "pnpm exec vp run --cache typecheck:tools",
]

[tasks.test]
description = "Full vitest suite, via vp"
run = "pnpm exec vp test"

[tasks."test:e2e"]
description = "Playwright end-to-end tests (web)"
run = "pnpm exec vp run e2e"

[tasks."test:e2e:desktop"]
description = "Playwright end-to-end tests against the built Electron app. Requires `mise run web:build && mise run desktop:build` first — Playwright launches out/desktop/main.cjs, it does not build it."
run = "pnpm exec vp run e2e:desktop"

[tasks."web:build"]
description = "Build apps/web via vp (Rolldown), cached — a hit restores out/web, it does not merely replay the log."
run = "pnpm exec vp run --cache build"

[tasks."web:dev"]
description = "Vite dev server via vp, from inside apps/web"
run = "cd apps/web && pnpm exec vp dev"

[tasks."api:build"]
description = "Build the public API bundle and declarations, cached (packcheck validates these artifacts)"
run = "pnpm exec vp run --cache build:api"

[tasks.packcheck]
description = "Validate the @app/web package manifest against its built artifacts (publint + attw)"
depends = ["api:build"]
run = "pnpm run packcheck"

[tasks."desktop:dev"]
description = "Launch Electron against the dev server (HMR), starting one if 127.0.0.1:5173 is not already serving. Set ELECTRON_RENDERER_URL to point elsewhere. Ctrl+C is the way out — the trap keeps that from being reported as a task failure, and takes a server this task started down with it."
run = """
# Electron loads 127.0.0.1:5173 and shows a white window with
# ERR_CONNECTION_REFUSED if nobody serves it, so own that dependency here
# instead of documenting it. An already-running `mise run dev` is reused and
# left alone; one started here dies with this task.
trap 'exit 0' INT
if ! curl -sfo /dev/null --max-time 1 http://127.0.0.1:5173/; then
  echo "no dev server on 5173 — starting one"
  # `set -m` so the server gets its own process group and the trap can take the
  # whole tree down: vite is a grandchild of `vp run dev`, so killing the pid
  # alone orphans a live server on 5173 (measured).
  set -m
  pnpm exec vp run dev &
  dev=$!
  trap 'kill -- -$dev 2>/dev/null; exit 0' INT EXIT
  until curl -sfo /dev/null --max-time 1 http://127.0.0.1:5173/; do
    kill -0 $dev 2>/dev/null || { echo "dev server exited before it served"; exit 1; }
    sleep 0.3
  done
fi
pnpm exec vp run start:desktop
"""

[tasks."desktop:start"]
description = "Build web + Electron and launch the built app (no dev server, no HMR) — what you want when verifying a real build."
run = "trap 'exit 0' INT; pnpm exec vp run desktop"

[tasks."desktop:build"]
description = "Build the Electron main/preload bundles, cached"
run = "pnpm exec vp run --cache build:electron"

[tasks.gate]
description = "The full pre-handoff gate: lint, all tsc lanes, vitest, and both builds. Green here is what a handoff claims — so lint and the test suites always execute; only the deterministic build/type stages may come from cache."
depends = ["lint", "typecheck", "test"]
run = ["pnpm exec vp run --cache build", "pnpm exec vp run --cache build:electron"]

[tasks."cache:clean"]
description = "Drop the vp task cache — the escape hatch when a cached result looks wrong."
run = "pnpm exec vp cache clean"

